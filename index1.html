<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FightStore — Экипировка для бокса</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      background: #101010;

      color: #fff;

      font-family: Arial, sans-serif;

    }

    header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 22px 6%;

      background: #191919;

      border-bottom: 1px solid #333;

    }

    .logo {

      font-size: 27px;

      font-weight: 900;

    }

    .logo span {

      color: #ff3838;

    }

    button {

      cursor: pointer;

      font-size: 15px;

    }

    .cart-button,

    .add-button {

      background: #ff3838;

      color: #fff;

      border: none;

      border-radius: 8px;

      padding: 12px 16px;

      font-weight: bold;

    }

    .cart-button:hover,

    .add-button:hover {

      background: #d82020;

    }

    .hero {

      padding: 65px 6%;

      background: linear-gradient(120deg, #292929, #111);

    }

    .hero h1 {

      font-size: clamp(32px, 5vw, 54px);

      margin-bottom: 15px;

    }

    .hero p {

      color: #bbb;

      line-height: 1.6;

    }

    .hero strong {

      color: #ff3838;

    }

    main {

      padding: 35px 6% 60px;

    }

    .toolbar {

      display: flex;

      gap: 12px;

      margin-bottom: 28px;

    }

    input,

    select {

      background: #202020;

      color: white;

      border: 1px solid #444;

      padding: 13px;

      border-radius: 8px;

      font-size: 15px;

    }

    input {

      flex: 1;

      min-width: 0;

    }

    .products {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      gap: 20px;

      margin-top: 22px;

    }

    .product {

      background: #1c1c1c;

      border: 1px solid #333;

      border-radius: 12px;

      overflow: hidden;

    }

    .product-image {

      height: 170px;

      background: #272727;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 72px;

    }

    .product-info {

      padding: 18px;

    }

    .category {

      color: #ff5555;

      font-size: 12px;

      text-transform: uppercase;

      margin-bottom: 10px;

    }

    .product h3 {

      margin-bottom: 10px;

    }

    .description {

      color: #aaa;

      font-size: 14px;

      line-height: 1.5;

      min-height: 42px;

    }

    .product-bottom {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-top: 18px;

    }

    .price {

      font-size: 18px;

      font-weight: bold;

    }

    .empty {

      color: #aaa;

      padding: 20px 0;

    }

    footer {

      text-align: center;

      padding: 25px;

      color: #888;

      border-top: 1px solid #333;

    }

    /* Окно корзины */
    .overlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 1000;

      background: rgba(0, 0, 0, 0.8);

      padding: 15px;

      align-items: center;

      justify-content: center;

    }

    .overlay.open {

      display: flex;

    }

    .cart-modal {

      background: #1b1b1b;

      width: 100%;

      max-width: 560px;

      max-height: 85vh;

      overflow-y: auto;

      border: 1px solid #444;

      border-radius: 14px;

      padding: 24px;

    }

    .cart-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;

    }

    .close-button {

      background: none;

      color: white;

      border: none;

      font-size: 30px;

      padding: 0 5px;

    }

    .cart-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding: 16px 0;

      border-bottom: 1px solid #383838;

    }

    .cart-item h3 {

      font-size: 16px;

      margin-bottom: 8px;

    }

    .cart-item-price {

      color: #ff5555;

      margin-bottom: 8px;

    }

    .remove-button {

      background: none;

      border: none;

      color: #ff6666;

      padding: 4px 0;

    }

    .quantity {

      display: flex;

      align-items: center;

      gap: 12px;

    }

    .quantity button {

      background: #333;

      color: white;

      border: none;

      border-radius: 5px;

      width: 30px;

      height: 30px;

    }

    .cart-footer {

      padding-top: 22px;

    }

    .total {

      font-size: 23px;

      font-weight: bold;

      margin-bottom: 18px;

    }

    .cart-actions {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }

    .clear-button {

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

      padding: 12px 16px;

    }

    @media (max-width: 500px) {

      header {

        padding: 18px 4%;

      }

      .logo {

        font-size: 22px;

      }

      .cart-button {

        padding: 10px;

        font-size: 13px;

      }

      .hero {

        padding: 45px 5%;

      }

      main {

        padding: 25px 5%;

      }

      .toolbar {

        flex-direction: column;

      }

      .cart-modal {

        padding: 18px;

      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">Fight<span>Store</span></div>

    <button type="button" class="cart-button" id="open-cart">

      🛒 Корзина (<span id="cart-count">0</span>)

    </button>

  </header>

  <section class="hero">

    <h1>Готовься к победе.</h1>

    <p>Экипировка для бокса — от первых тренировок до спаррингов.</p>

    <p><strong>Твой характер. Твоя сила.</strong></p>

  </section>

  <main>

    <div class="toolbar">

      <input id="search" type="search" placeholder="Найти экипировку...">

      <select id="category">

        <option value="all">Все товары</option>

        <option value="Перчатки">Перчатки</option>

        <option value="Защита">Защита</option>

        <option value="Аксессуары">Аксессуары</option>

      </select>

    </div>

    <h2>Каталог товаров</h2>

    <section class="products" id="products"></section>

  </main>

  <footer>

    FightStore © 2026 — Экипировка для настоящих бойцов

  </footer>

  <div class="overlay" id="cart-overlay">

    <section class="cart-modal" role="dialog" aria-modal="true"

      aria-labelledby="cart-title">

      <div class="cart-header">

        <h2 id="cart-title">Твоя корзина</h2>

        <button type="button" class="close-button" id="close-cart"

          aria-label="Закрыть корзину">&times;</button>

      </div>

      <div id="cart-items"></div>

      <div class="cart-footer">

        <div class="total">

          Итого: <span id="cart-total">0 ₽</span>

        </div>

        <div class="cart-actions">

          <button type="button" class="cart-button" id="checkout">

            Оформить заказ

          </button>
          <button type="button" class="clear-button" id="clear-cart">

            Очистить корзину

          </button>

        </div>

      </div>

    </section>

  </div>

  <script>

    const products = [

      {

        id: 1,

        name: "Боксёрские перчатки",

        category: "Перчатки",

        description: "Для тренировок и спаррингов.",

        price: 3990,

        emoji: "🥊"

      },

      {

        id: 2,

        name: "Защитный шлем",

        category: "Защита",

        description: "Дополнительная защита головы.",

        price: 2990,

        emoji: "🥋"

      },

      {

        id: 3,

        name: "Боксёрские бинты",

        category: "Аксессуары",

        description: "Поддержка кистей и запястий.",

        price: 590,

        emoji: "🩹"

      },

      {

        id: 4,

        name: "Скакалка",

        category: "Аксессуары",

        description: "Для разминки и выносливости.",

        price: 790,

        emoji: "〰️"

      },

      {

        id: 5,

        name: "Тренировочные перчатки",

        category: "Перчатки",

        description: "Для регулярных занятий боксом.",

        price: 3490,

        emoji: "🥊"

      },

      {

        id: 6,

        name: "Боксёрская капа",

        category: "Защита",

        description: "Защита зубов во время тренировок.",

        price: 690,

        emoji: "🦷"

      }

    ];

    const productsContainer = document.querySelector("#products");

    const searchInput = document.querySelector("#search");

    const categorySelect = document.querySelector("#category");

    const openCartButton = document.querySelector("#open-cart");

    const closeCartButton = document.querySelector("#close-cart");

    const cartOverlay = document.querySelector("#cart-overlay");

    const cartItemsContainer = document.querySelector("#cart-items");

    const cartCount = document.querySelector("#cart-count");

    const cartTotal = document.querySelector("#cart-total");

    let cart = [];

    try {

      const savedCart = JSON.parse(

        localStorage.getItem("fightstore-cart") || "[]"

      );

      if (Array.isArray(savedCart)) {

        cart = savedCart.filter(function(item) {

          return products.some(function(product) {

            return product.id === item.id;

          }) && Number.isInteger(item.quantity) && item.quantity > 0;

        });

      }

    } catch (error) {

      cart = [];

    }

    function formatPrice(price) {

      return price.toLocaleString("ru-RU") + " ₽";

    }

    function renderProducts() {

      const searchText = searchInput.value.trim().toLowerCase();

      const selectedCategory = categorySelect.value;

      const filteredProducts = products.filter(function(product) {

        const matchesSearch =

          product.name.toLowerCase().includes(searchText);

        const matchesCategory =

          selectedCategory === "all" ||

          product.category === selectedCategory;

        return matchesSearch && matchesCategory;

      });

      if (filteredProducts.length === 0) {

        productsContainer.innerHTML =

          '<p class="empty">Товары не найдены.</p>';

        return;

      }

      productsContainer.innerHTML = filteredProducts.map(function(product) {

        return `

          <article class="product">

            <div class="product-image">${product.emoji}</div>

            <div class="product-info">

              <div class="category">${product.category}</div>

              <h3>${product.name}</h3>

              <p class="description">${product.description}</p>

              <div class="product-bottom">

                <span class="price">${formatPrice(product.price)}</span>

                <button

                  type="button"

                  class="add-button"

                  data-add="${product.id}"

                >

                  В корзину

                </button>

              </div>

            </div>

          </article>

        `;

      }).join("");

    }

    function saveCart() {

      try { 
        localStorage.setItem("fightstore-cart", JSON.stringify(cart));

      } catch (error) {

        console.warn("Не удалось сохранить корзину в браузере.");

      }

    }

    function addToCart(productId) {

      const existingItem = cart.find(function(item) {

        return item.id === productId;

      });

      if (existingItem) {

        existingItem.quantity += 1;

      } else {

        cart.push({

          id: productId,

          quantity: 1

        });

      }

      updateCart();

    }

    function changeQuantity(productId, amount) {

      const item = cart.find(function(item) {

        return item.id === productId;

      });

      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {

        removeFromCart(productId);

        return;

      }

      updateCart();

    }

    function removeFromCart(productId) {

      cart = cart.filter(function(item) {

        return item.id !== productId;

      });

      updateCart();

    }

    function clearCart() {

      cart = [];

      updateCart();

    }

    function updateCart() {

      saveCart();

      const totalQuantity = cart.reduce(function(sum, item) {

        return sum + item.quantity;

      }, 0);

      const totalPrice = cart.reduce(function(sum, item) {

        const product = products.find(function(product) {

          return product.id === item.id;

        });

        return sum + (product ? product.price * item.quantity : 0);

      }, 0);

      cartCount.textContent = totalQuantity;

      cartTotal.textContent = formatPrice(totalPrice);

      renderCart();

    }

    function renderCart() {

      if (cart.length === 0) {

        cartItemsContainer.innerHTML =

          '<p class="empty">Корзина пока пуста. Добавь товары из каталога!</p>';

        return;

      }

      cartItemsContainer.innerHTML = cart.map(function(item) {

        const product = products.find(function(product) {

          return product.id === item.id;

        });

        if (!product) return "";

        return `

          <div class="cart-item">

            <div>

              <h3>${product.name}</h3>

              <p class="cart-item-price">

                ${formatPrice(product.price * item.quantity)}

              </p>

              <button

                type="button"

                class="remove-button"

                data-remove="${product.id}"

              >

                Удалить

              </button>

            </div>

            <div class="quantity">

              <button

                type="button"

                data-change="${product.id}"

                data-amount="-1"

                aria-label="Уменьшить количество"

              >−</button>

              <span>${item.quantity}</span>

              <button

                type="button"

                data-change="${product.id}"

                data-amount="1"

                aria-label="Увеличить количество"

              >+</button>

            </div>

          </div>

        `;

      }).join("");

    }

    function openCart() {

      cartOverlay.classList.add("open");

    }

    function closeCart() {

      cartOverlay.classList.remove("open");

    }

    // Открытие корзины

    openCartButton.addEventListener("click", openCart);

    // Закрытие корзины

    closeCartButton.addEventListener("click", closeCart);

    // Закрытие при нажатии на тёмный фон

    cartOverlay.addEventListener("click", function(event) {

      if (event.target === cartOverlay) {

        closeCart();

      }

    });

    // Закрытие клавишей Escape

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeCart();

      }

    });

    // Добавление товаров

    productsContainer.addEventListener("click", function(event) {

      const button = event.target.closest("[data-add]");

      if (!button) return;

      addToCart(Number(button.dataset.add));

    });

    // Изменение количества и удаление товаров

    cartItemsContainer.
    addEventListener("click", function(event) {

      const removeButton = event.target.closest("[data-remove]");

      if (removeButton) {

        removeFromCart(Number(removeButton.dataset.remove));

        return;

      }

      const changeButton = event.target.closest("[data-change]");

      if (changeButton) {

        changeQuantity(

          Number(changeButton.dataset.change),

          Number(changeButton.dataset.amount)

        );

      }

    });

    // Поиск и фильтрация

    searchInput.addEventListener("input", renderProducts);

    categorySelect.addEventListener("change", renderProducts);

    // Очистка корзины

    document.querySelector("#clear-cart").addEventListener("click", clearCart);

    // Демонстрационное оформление заказа

    document.querySelector("#checkout").addEventListener("click", function() {

      if (cart.length === 0) {

        alert("Сначала добавь товар в корзину.");

        return;

      }

      alert("Это демонстрационный магазин: реальная оплата пока не подключена.");

    });

    // Первоначальное отображение

    renderProducts();

    updateCart();

  </script>

</body>

</html>
